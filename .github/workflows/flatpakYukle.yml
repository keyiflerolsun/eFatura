# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.

name: Flatpak Yükleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  FlatpakYukleyici:
    name    : Flatpak Yükleyici
    runs-on : ubuntu-latest

    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      - name: UV Kurulumu
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true

      - name: Değişkenleri Ayarla
        run : |
          PAKET_V=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' pyproject.toml | head -n 1)
          PAKET_ADI=$(sed -n 's/.*"Shared\/\([^"]*\)\.desktop".*/\1/p' pyproject.toml | head -n 1)

          echo "PAKET_V=$PAKET_V" >> $GITHUB_ENV
          echo "PAKET_ADI=$PAKET_ADI" >> $GITHUB_ENV

          echo "Paket Adı: $PAKET_ADI"
          echo "Paket Sürümü: $PAKET_V"

      - name: Flatpak Runtime Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-50-${{ runner.os }}
          restore-keys: |
            flatpak-runtime-50-

      - name: Flatpak Builder Cache
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('Shared/org.kekikakademi.eFatura.yml', 'Shared/SRC/**') }}
          restore-keys: |
            flatpak-builder-

      - name: Flatpak Ortamını Hazırla
        run : |
          sudo apt update -qq
          sudo apt install -y flatpak flatpak-builder --fix-missing
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo --user
          flatpak remote-add --if-not-exists flathub-beta https://flathub.org/beta-repo/flathub-beta.flatpakrepo --user
          flatpak update && flatpak upgrade
          flatpak install flathub org.gnome.{Platform,Sdk}//50 -y --noninteractive --user

      - name: Paketle
        run : |
          mv Shared/*.yml . && mv Shared/SRC .
          flatpak-builder --repo=github --force-clean build-dir $PAKET_ADI.yml
          flatpak build-bundle github $PAKET_ADI.flatpak $PAKET_ADI

      - name: Artıkları Temizle
        run : |
          find . -maxdepth 1 -name ".flatpak*" ! -name ".flatpak-builder" -exec rm -rf {} +
          rm -rf .vscode build-dir && find . | grep -E "(__pycache__|\.pyc|\.pyo$)" | xargs rm -rf

      - name: Paketi GitHub'a Yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PAKET_ADI }}
          path: ./${{ env.PAKET_ADI }}.flatpak

      - name: Güncelleme Kontrol Et
        id  : guncelleme_var_mi
        run : |
          if git diff --name-only HEAD^ | grep -q "pyproject.toml"; then echo "degisiklik=true"; else echo "degisiklik=false"; fi >> $GITHUB_OUTPUT

      - name: GitHub Release Oluştur
        if  : steps.guncelleme_var_mi.outputs.degisiklik == 'true'
        uses: softprops/action-gh-release@v2
        env :
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name   : ${{ env.PAKET_V }}
          body       : 🕊 **${{ env.PAKET_ADI }}** _GitHub tarafından_ `${{ env.PAKET_V }}`'e _Otomatik olarak paketlendi.._
          draft      : false
          prerelease : false
          files      : |
            ./${{ env.PAKET_ADI }}.flatpak
