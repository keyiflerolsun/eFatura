[project]
name        = "eFatura"
version     = "1.1.7"
description = "Vergi veya TC Kimlik Numarasından E-Fatura Mükellefiyet Sorgusu"
keywords    = ["eFatura", "KekikAkademi", "keyiflerolsun"]
license     = { text = "GPLv3+" }
readme      = "README.md"

authors = [
    { name = "keyiflerolsun", email = "keyiflerolsun@gmail.com" }
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3"
]

requires-python = ">=3.10"
dependencies    = [
    "rich",
    "requests",
    "urllib3",
    "pillow",
    "pytesseract",
    "pygobject"
]

[project.scripts]
eFatura    = "eFatura.konsol:basla"
eFaturaGUI = "eFatura.arayuz:basla"

[project.gui-scripts]
eFaturaGUI = "eFatura.arayuz:basla"

[project.optional-dependencies]
dev = [
    "pytest"
]

[dependency-groups]
dev = [
    "pytest"
]

[project.urls]
Homepage   = "https://github.com/keyiflerolsun/eFatura"
Repository = "https://github.com/keyiflerolsun/eFatura.git"
Issues     = "https://github.com/keyiflerolsun/eFatura/issues"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eFatura"]

[tool.hatch.build.targets.wheel.shared-data]
"Shared/org.kekikakademi.eFatura.desktop"     = "share/applications/org.kekikakademi.eFatura.desktop"
"Shared/org.kekikakademi.eFatura.appdata.xml" = "share/appdata/org.kekikakademi.eFatura.appdata.xml"
"Shared/org.kekikakademi.eFatura.svg"         = "share/icons/hicolor/scalable/apps/org.kekikakademi.eFatura.svg"
